# Test settings for this repository. Run the tests from the repository root:
#
#     python -m pytest paper2/telohelm/tests paper2/experiment2/tests
#
# The tests listed below read files that this repository does not include: development jobs, files of the author's
# earlier study and the history of the author's private repository. They are left out here so that the suite runs
# from the public files alone.
[pytest]
addopts =
    --deselect paper2/experiment2/tests/test_controller_history_inputs_codex.py::test_precise_history_manifest_is_reproducible_and_hashes_numeric_inputs
    --deselect paper2/experiment2/tests/test_controller_history_profile_codex.py::test_96_fresh_toy_instances_scopes_counts_and_immutable_inputs
    --deselect paper2/experiment2/tests/test_controller_history_profile_codex.py::test_full_payload_freeze_and_tamper_refusal
    --deselect paper2/experiment2/tests/test_controller_history_profile_codex.py::test_unknown_clocks_failures_and_invalid_campaigns_stay_explicit
    --deselect paper2/experiment2/tests/test_controller_late_profile_codex.py::test_combined_projection_cannot_lower_same_campaign_maxima
    --deselect paper2/experiment2/tests/test_controller_late_profile_codex.py::test_exact_schedule_uses_all_frozen_bytes_once_before_measurement
    --deselect paper2/experiment2/tests/test_controller_late_profile_codex.py::test_incomplete_or_unavailable_evidence_never_gives_numeric_fit[duplicate]
    --deselect paper2/experiment2/tests/test_controller_late_profile_codex.py::test_incomplete_or_unavailable_evidence_never_gives_numeric_fit[error]
    --deselect paper2/experiment2/tests/test_controller_late_profile_codex.py::test_incomplete_or_unavailable_evidence_never_gives_numeric_fit[hash]
    --deselect paper2/experiment2/tests/test_controller_late_profile_codex.py::test_incomplete_or_unavailable_evidence_never_gives_numeric_fit[missing]
    --deselect paper2/experiment2/tests/test_controller_late_profile_codex.py::test_incomplete_or_unavailable_evidence_never_gives_numeric_fit[short-unknown]
    --deselect paper2/experiment2/tests/test_controller_late_profile_codex.py::test_incomplete_or_unavailable_evidence_never_gives_numeric_fit[unknown]
    --deselect paper2/experiment2/tests/test_controller_late_profile_codex.py::test_incomplete_or_unavailable_evidence_never_gives_numeric_fit[warm]
    --deselect paper2/experiment2/tests/test_identity_separation.py::test_m1_and_the_new_tests_use_only_unreserved_development_identities
    --deselect paper2/experiment2/tests/test_ladder.py::test_flying_calls_use_study_1s_per_role_output_limits
    --deselect paper2/experiment2/tests/test_local_model.py::test_the_models_get_study_1s_settings
    --deselect paper2/experiment2/tests/test_poc_step2.py::test_the_cluster_guard_is_the_step1_guard_byte_for_byte
    --deselect paper2/experiment2/tests/test_run_stream.py::test_the_job_gates_containment_before_any_model_and_fails_on_this_mac
    --deselect paper2/experiment2/tests/test_run_stream.py::test_the_jobs_token_check_passes_when_the_server_agrees_and_fails_when_it_cannot_ask
    --deselect paper2/experiment2/tests/test_study_host.py::test_the_spawn_helper_is_the_accepted_m1_one
    --deselect paper2/experiment2/tests/test_turn119_review_codex.py::test_job_preserves_failed_stream_exit_code
    --deselect paper2/experiment2/tests/test_turn119_review_codex.py::test_settings_equal_study1_and_repaired_output_cap
    --deselect paper2/experiment2/tests/test_turn141_review_codex.py::test_numeric_manifests_expand_all_recipes_and_preserve_boundary_offsets
    --deselect paper2/experiment2/tests/test_turn141_review_codex.py::test_stateful_public_inputs_are_valid_without_search_and_cover_distinct_beliefs
    --deselect paper2/experiment2/tests/test_turn143_review_codex.py::test_review_artifact_hashes_bind_exact_source_and_new_harness
    --deselect paper2/experiment2/tests/test_turn145_review_codex.py::test_measured_campaign_retains_all_fixed_keys_costs_and_actual_exposures
    --deselect paper2/experiment2/tests/test_turn191_codex.py::test_cleanup_failed_kill_does_not_overwrite_intended_exit[0-poc-step3-stream.sbatch]
    --deselect paper2/experiment2/tests/test_turn191_codex.py::test_cleanup_failed_kill_does_not_overwrite_intended_exit[0-poc-step4.sbatch]
    --deselect paper2/experiment2/tests/test_turn191_codex.py::test_cleanup_failed_kill_does_not_overwrite_intended_exit[1-poc-step3-stream.sbatch]
    --deselect paper2/experiment2/tests/test_turn191_codex.py::test_cleanup_failed_kill_does_not_overwrite_intended_exit[1-poc-step4.sbatch]
    --deselect paper2/experiment2/tests/test_turn193_codex.py::test_jobs_use_owned_ports_for_readiness_parity_clients_and_watch[poc-step3-stream.sbatch]
    --deselect paper2/experiment2/tests/test_turn193_codex.py::test_jobs_use_owned_ports_for_readiness_parity_clients_and_watch[poc-step4.sbatch]
    --deselect paper2/experiment2/tests/test_turn193_codex.py::test_jobs_use_owned_ports_for_readiness_parity_clients_and_watch[poc-step5.sbatch]
    --deselect paper2/experiment2/tests/test_turn209_review_codex.py::test_frozen_c0_natively_rejects_the_original_wrong_controller_witness
    --deselect paper2/telohelm/tests/test_sandbox.py::test_protected_repository_files_are_refused
    --deselect paper2/telohelm/tests/test_turn100_review_codex.py::test_registry_restoration_runs_in_a_fresh_interpreter
    --deselect paper2/telohelm/tests/test_turn121_review_codex.py::test_server_token_count_mismatch_is_fatal
